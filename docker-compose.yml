version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: m-os-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketing_os
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: m-os-redis
    ports:
      - "6379:6379"

  backend:
    build: 
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: m-os-backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/marketing_os
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_fallback_secret
      PORT: 4000
    depends_on:
      - postgres
      - redis

  user-app:
    build:
      context: .
      dockerfile: apps/user/Dockerfile
    container_name: m-os-user
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres_data:
